version: 2
builds:
  - id: isapex
    main: ./isapex
    binary: isapex
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - '{{ if eq .Os "linux" }}-extldflags=-static{{ end }}'
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: '{{ if eq .Os "linux" }}upx --best --lzma {{ .Path }}{{ else }}true{{ end }}'
