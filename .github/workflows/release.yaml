name: 'goreleaser'

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      skip_macos:
        description: 'Skip macOS builds'
        required: false
        default: false
        type: boolean
      
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      -
        name: Install UPX
        run: |
          echo "Installing UPX for binary compression..."
          wget https://github.com/upx/upx/releases/download/v4.0.2/upx-4.0.2-amd64_linux.tar.xz
          tar -xf upx-4.0.2-amd64_linux.tar.xz
          sudo mv upx-4.0.2-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.0.2-amd64_linux*
          upx --version
          echo "UPX installed successfully"
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Verify Compressed Binaries
        run: |
          echo "Verifying compressed binaries work correctly..."
          # Test wappalyzator binary
          ./dist/wappalyzator_linux_amd64_v1/wappalyzator https://www.google.com
          echo "✅ All binaries verified successfully"
          
